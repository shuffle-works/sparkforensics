name: CI

# Push on main + PRs into main. Scoping push to main avoids double-running CI
# (push + pull_request) on feature branches that have an open PR; the
# concurrency group below still cancels superseded runs of each.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: CI only reads the checkout.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR instead of queuing redundant work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The tuning reference (packages/core/src/docs-content/{chapters,tuning,
      # diagrams}) isn't committed: generate it from the pin in upstream.json
      # as its own step, so a network or upstream failure shows up here rather
      # than inside the build or test output that would otherwise fetch it.
      - run: npm run docs:fetch
      # dist/ is no longer committed (see deploy.yml): build it before
      # `npm test` runs, since tests/vite-entry.test.js asserts against the
      # production bundle's output.
      - run: npm run build
      - run: npm run test:coverage
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage/lcov.info
          flag-name: build
          parallel: true
      - run: npx tsc --noEmit
      - run: npm run lint
      - uses: dorny/paths-filter@v4
        id: docs-filter
        with:
          filters: |
            docs:
              - 'docs-site/**'
              - 'docs/**'
      - name: Build docs site (validates internal links/anchors)
        if: steps.docs-filter.outputs.docs == 'true'
        run: npm run docs:build

  # packages/core has no bin to pack-and-spawn: its unit tests run directly
  # against packages/core/src, no vendoring involved.
  # Checks out dev/log-corpus (the public spark-event-corpus-data submodule) so
  # the corpus-backed tests run instead of skipping, and so the detector
  # regression gate below has its logs.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Generates the uncommitted tuning reference; see the build job.
      - run: npm run docs:fetch
      - run: npm run test:core
      # Detector regression gate: re-analyzes every corpus log and fails on any
      # finding added, removed, re-banded or re-estimated against the committed
      # snapshot. For an intended change, refresh it (see
      # docs-site/contributor-guide/testing.md#corpus-regression-snapshot).
      - name: Corpus findings match dev/corpus-snapshot.json
        run: node dev/bench-analyze.mjs --check dev/corpus-snapshot.json
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: packages/core/coverage/lcov.info
          flag-name: core
          parallel: true

  # cli and mcp each pack-and-spawn the real published tarball (see
  # packages/cli/test/analyze.test.js, packages/mcp/test/mcp.test.js): this
  # is what actually catches a broken vendor-core/files setup, matching the
  # server job's existing bin.test.js pattern. Failing here, not just in
  # release.yml, keeps a broken publish setup off main entirely.
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Generates the uncommitted tuning reference; see the build job.
      - run: npm run docs:fetch
      - run: npm run test:cli
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: packages/cli/coverage/lcov.info
          flag-name: cli
          parallel: true

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Generates the uncommitted tuning reference; see the build job.
      - run: npm run docs:fetch
      - run: npm run test:mcp
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: packages/mcp/coverage/lcov.info
          flag-name: mcp
          parallel: true

  # The local-server deploy mode has its own package + suite that the root
  # vitest glob (tests/**) never runs; guard it in a parallel job.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        # For test/shs-proxy-fixture.test.js, which reads a corpus log.
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # The server bin test builds the root Vite frontend via
      # scripts/copy-frontend.js (`npm run build` in the repo root), so the
      # root deps must be installed alongside the server package's own.
      # packages/server is an npm-workspaces member (root package-lock.json
      # already has its entry), so this one root `npm ci` hoists everything
      # it needs; a second, packages/server-scoped `npm ci` here used to
      # prune the sibling @sparkforensics/core / cli / mcp symlinks out of
      # the shared node_modules (leftover from before server/ became a
      # workspace member, when it needed a fully independent install), which
      # broke this job's own bin.test.js by making the root build unable to
      # resolve @sparkforensics/core.
      - run: npm ci
      # Generates the uncommitted tuning reference; see the build job.
      - run: npm run docs:fetch
      - run: npm run test:coverage
        working-directory: packages/server
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: packages/server/coverage/lcov.info
          flag-name: server
          parallel: true

  # The published cli/mcp/server packages declare engines node >=18, but the
  # suites above run on .nvmrc's Node only, and vitest itself needs Node 22+. So
  # pack the real tarballs on .nvmrc's Node, then install and run the bins on
  # Node 18: the CLI over every corpus log (plus one zstd copy, which takes the
  # fzstd fallback since Node 18 has no native zstd), an MCP initialize
  # handshake, and a server start that serves the app and answers /mcp.
  node18:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Generates the uncommitted tuning reference; see the build job.
      - run: npm run docs:fetch
      - name: Pack cli, mcp and server
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          npm pack --workspace packages/cli --workspace packages/mcp --workspace packages/server --pack-destination "$RUNNER_TEMP/packs"
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - name: Install the packed tarballs on Node 18
        working-directory: ${{ runner.temp }}
        run: |
          node --version
          mkdir smoke && cd smoke
          echo '{}' > package.json
          npm install "$RUNNER_TEMP"/packs/*.tgz
      - name: CLI analyzes every corpus log on Node 18
        run: |
          bin="$RUNNER_TEMP/smoke/node_modules/.bin/sparkforensics-analyze"
          for log in dev/log-corpus/logs/*.ndjson dev/log-corpus/logs/external/*.ndjson; do
            # Exit 3 (inconclusive) is a completed analysis: failure-killed-run never records ApplicationEnd.
            rc=0; "$bin" "$log" --format json > /dev/null || rc=$?
            [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || { echo "failed ($rc): $log"; exit 1; }
          done
          zstd -q -o "$RUNNER_TEMP/sample.zstd" dev/log-corpus/logs/spark-4.1.3-parquet-baseline.ndjson
          "$bin" "$RUNNER_TEMP/sample.zstd" --format json > /dev/null
      - name: MCP server answers initialize on Node 18
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 20 "$RUNNER_TEMP/smoke/node_modules/.bin/sparkforensics-mcp" | tee "$RUNNER_TEMP/mcp.out" | head -c 300
          grep -q '"serverInfo"' "$RUNNER_TEMP/mcp.out"
      - name: Server starts and answers on Node 18
        run: |
          "$RUNNER_TEMP/smoke/node_modules/.bin/sparkforensics-server" --port 4199 &
          trap 'kill $!' EXIT
          curl -sf --retry 20 --retry-connrefused --retry-delay 1 -o "$RUNNER_TEMP/index.html" http://127.0.0.1:4199/
          grep -q '<div id="root"' "$RUNNER_TEMP/index.html"
          curl -sf -o "$RUNNER_TEMP/server-mcp.out" -X POST http://127.0.0.1:4199/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          grep -q '"serverInfo"' "$RUNNER_TEMP/server-mcp.out"

  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./scripts/check-changeset.sh "${{ github.base_ref }}"

  # Merges the five parallel lcov uploads above into one Coveralls report for
  # the commit/PR.
  finish:
    needs: [build, core, cli, mcp, server]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
