version: 2

updates:
  # Root npm workspace: covers the root package.json plus the hoisted
  # packages/core, packages/cli, and packages/mcp members (they share the
  # root package-lock.json). packages/server keeps its own lockfile (see
  # ci.yml/release.yml) and gets a separate entry below.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "DBOT"

  - package-ecosystem: "npm"
    directory: "/packages/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "DBOT"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "DBOT"
